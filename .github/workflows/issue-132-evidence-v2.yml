name: Issue 132 final evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue-132-evidence-v2.yml"
      - "packages/core/src/domain/schemas/**"
      - "packages/core/src/domain/services/stack-lock-**"
      - "docs/generated/**"
      - "docs/03_SPEC/Minimal_Schemas.md"
      - "docs/Phased_Spec_Activation.md"
      - "openspec/changes/m2-research-context/**"

permissions:
  contents: write

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-132-stack-lock-dirty-state
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Initialize zero
        run: git submodule update --init zero
      - name: Align canonical and OpenSpec contracts
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import textwrap

          def write_if_changed(path: Path, value: str) -> None:
              if not value.endswith("\n"):
                  value += "\n"
              path.write_text(value)

          # Canonical StackLock: actual checkout commit/branch plus required dirty.
          minimal = Path("docs/03_SPEC/Minimal_Schemas.md")
          text = minimal.read_text()
          for name in ("SHUD", "rSHUD", "AutoSHUD", "zero"):
              pattern = re.compile(rf"^(\s*{re.escape(name)}:\s*\{{[^\n}}]*)(\}}.*)$", re.MULTILINE)
              matches = list(pattern.finditer(text))
              if not matches:
                  raise SystemExit(f"Minimal_Schemas missing {name} repo example")
              # Only the canonical StackLock example is changed; other examples already carrying dirty are left alone.
              for match in reversed(matches[:1]):
                  line = match.group(0)
                  if "dirty:" not in line:
                      replacement = match.group(1).rstrip()
                      if replacement.endswith(","):
                          replacement += " dirty: false "
                      else:
                          replacement += ", dirty: false "
                      text = text[:match.start()] + replacement + match.group(2) + text[match.end():]
          note_heading = "**repos 字段说明（#132 bug 级修正）：**"
          if note_heading not in text:
              anchor = "**llm 字段说明**（AGA-P0-1）："
              if anchor not in text:
                  raise SystemExit("Minimal_Schemas llm anchor missing")
              note = (
                  "**repos 字段说明（#132 bug 级修正）：** `commit` 与 `branch` 表示采集时四个实际 "
                  "checkout 的 `HEAD` 与分支；detached HEAD 统一记录 `branch: \"detached\"`。`dirty` 为必填 "
                  "boolean，覆盖 tracked 与 untracked 变化。superproject gitlink 与 `HEAD:.gitmodules` 仅作为四个 "
                  "checkout 路径及采集代际的内部 authority，不得冒充实际 checkout commit/branch。任一 checkout "
                  "或 authority 在双快照间变化时整次采集 fail closed，不产生部分 StackLock。\n\n"
              )
              text = text.replace(anchor, note + anchor, 1)
          write_if_changed(minimal, text)

          # Change design: replace D7a as one bounded section.
          design = Path("openspec/changes/m2-research-context/design.md")
          text = design.read_text()
          d7a = textwrap.dedent('''
          ### D7a. StackLock repo 采集：gitlink 代际 authority + 实际 checkout 状态

          superproject `HEAD` 的四个 gitlink 与同一 generation 的 `HEAD:.gitmodules` 只负责确认 SHUD/rSHUD/AutoSHUD/zero 四个声明路径及代际完整性；它们 **不是** StackLock `repos.*.commit/branch` 的输出值。每个声明路径均须以 no-follow 物理目录身份 `(path, dev, ino)` 绑定，并证明 `git --no-lazy-fetch rev-parse --show-toplevel --show-prefix` 的 top-level 精确等于该 checkout 且 prefix 为空。

          StackLock `repos` 对每个实际 checkout 读取：`rev-parse HEAD` → `commit`，`rev-parse --abbrev-ref HEAD` → `branch`（`HEAD` 规范化为 `detached`），`status --porcelain=v1 --untracked-files=all --` → required `dirty`。实际 checkout HEAD 可以合法偏离 superproject gitlink；这种偏离必须被忠实记录，不能拒绝、回退或伪装成 gitlink。采集前后两次 cheap snapshot 同时比较 root authority、四 gitlink、四 checkout 物理身份、实际 `commit/branch/dirty`、`.gitmodules`、package/provider 配置；任一变化均以 `collection_state_changed` fail closed，零 partial result。

          runtime 版本（r/python/sundials/gcc/gdal）M2 填占位探测值或 `unknown`。`harness.version` = 仓库根 `package.json` 版本；`cli_version="unknown"`、`prompt_pack="promptpack-unset"`、`skills_version="skills-unset"`。`llm` 从 provider 配置读取 provider/model_id/base_url；`params_digest` = canonical `{}` sha256，`prompt_pack_digest` = 空字节 sha256，两者语义独立且值不同。
          ''').strip()
          text, count = re.subn(r"### D7a\.[\s\S]*?(?=\n### D8\.)", d7a, text, count=1)
          if count != 1:
              raise SystemExit(f"design D7a replacement count was {count}")
          write_if_changed(design, text)

          # OpenSpec requirement: additive and idempotent updates around stable headings.
          spec = Path("openspec/changes/m2-research-context/specs/stack-lock/spec.md")
          text = spec.read_text()
          text = text.replace(
              "各含 commit + branch——",
              "各含 commit + branch + required `dirty: boolean`——",
              1,
          )
          text = text.replace(
              "以含四 repo commit、runtime 占位、完整 llm 块的输入校验",
              "以含四 repo 实际 commit/branch/dirty、runtime 占位、完整 llm 块的输入校验",
              1,
          )
          actual_requirement = (
              "四个 gitlink 与 `HEAD:.gitmodules` SHALL 仅作为路径和代际 authority。采集服务 MUST 对每个声明 "
              "checkout 读取实际 `HEAD`、实际 branch（detached 规范化为 `detached`）以及覆盖 tracked + untracked "
              "的 `dirty`；实际 HEAD 与 gitlink 不同是合法状态，必须记录实际值。每个 checkout 的物理目录身份与完整 "
              "`commit/branch/dirty` MUST 纳入两次 cheap snapshot；任一 checkout 路径替换或状态漂移 → "
              "`collection_state_changed`，不返回 partial result。\n\n"
          )
          scenario_heading = "#### Scenario: 四个 submodule commit 均可读取"
          if actual_requirement.strip() not in text:
              if scenario_heading not in text:
                  raise SystemExit("stack-lock first scenario heading missing")
              text = text.replace(scenario_heading, actual_requirement + scenario_heading, 1)
          old_then = "- **THEN** 返回四个 repo 各自的 40 位 commit hash，zero 的 commit 等于 pin `13e25c116c62411e6ee8a0ad67a6c53dc7c376c6`"
          new_then = "- **THEN** 返回四个 repo 各自的实际 40 位 HEAD commit；在 canonical checkout 中 zero 等于 pin `13e25c116c62411e6ee8a0ad67a6c53dc7c376c6`"
          text = text.replace(old_then, new_then, 1)
          new_scenarios_heading = "#### Scenario: 实际 checkout HEAD 可偏离 gitlink"
          if new_scenarios_heading not in text:
              nested_heading = "#### Scenario: nested directory 不是仓库根"
              scenarios = textwrap.dedent('''
              #### Scenario: 实际 checkout HEAD 可偏离 gitlink

              - **WHEN** SHUD checkout 在 superproject gitlink 之后产生本地 commit 或切换到其他 branch
              - **THEN** `repos.SHUD.commit/branch` 记录实际 checkout 状态，gitlink 仍只参与代际一致性检查；不拒绝、不回退到 gitlink

              #### Scenario: dirty 与 detached 状态完整记录

              - **WHEN** 任一 checkout 有 tracked 修改、untracked 文件，或处于 detached HEAD
              - **THEN** 前两者 `dirty=true`，干净 sibling 为 false；detached checkout 的 `branch="detached"`

              #### Scenario: checkout 状态跨快照漂移

              - **WHEN** 任一 checkout 的 HEAD、branch、dirty 或物理目录身份在两次 snapshot 间变化
              - **THEN** 以 `collection_state_changed` 拒绝且不发布任何 partial StackLock content

              ''')
              if nested_heading not in text:
                  raise SystemExit("stack-lock nested scenario heading missing")
              text = text.replace(nested_heading, scenarios + nested_heading, 1)
          text = text.replace(
              "`fingerprint` SHALL 是对 StackLock **内容字段**（`repos`/`runtime`/`harness`/`llm`）canonical JSON",
              "`fingerprint` SHALL 是对 StackLock **内容字段**（`repos`，含四项实际 commit/branch/dirty；`runtime`/`harness`/`llm`）canonical JSON",
              1,
          )
          text = text.replace(
              "- **WHEN** 改动 `llm.base_url` 后再次 lock\n- **THEN** fingerprint 与此前不同",
              "- **WHEN** 改动 `llm.base_url`，或任一 repo 从 clean 变 dirty / dirty 变 clean 后再次 lock\n- **THEN** fingerprint 与此前不同",
              1,
          )
          text = text.replace(
              "GET 返回与响应 `stack` 字段一致的同一记录，含四 repo commit、llm.base_url 与 fingerprint",
              "GET 返回与响应 `stack` 字段一致的同一记录，完整保留四 repo 实际 commit/branch/dirty、llm.base_url 与 fingerprint",
              1,
          )
          write_if_changed(spec, text)

          # Frozen-spec bug correction ledger.
          ledger = Path("docs/Phased_Spec_Activation.md")
          text = ledger.read_text()
          batch_heading = "**例外批次 8（2026-07-27，#132 bug 级修正）**"
          if batch_heading not in text:
              anchor = "\n**依据：**"
              if anchor not in text:
                  raise SystemExit("Phased_Spec_Activation authority anchor missing")
              batch = (
                  "\n**例外批次 8（2026-07-27，#132 bug 级修正）**：IR-001 的“实际运行状态可复现”与既有 "
                  "StackLock 示例只记录 superproject gitlink commit 发生语义冲突；gitlink 不能代表 checkout 的本地 commit、"
                  "detached branch 或 tracked/untracked dirty 状态。修正 `Minimal_Schemas.md` §2、M2 design/spec/tasks 与生成 "
                  "schema：四 repo revision 增 required `dirty:boolean`，commit/branch 改为实际 checkout 状态；gitlink + "
                  "`HEAD:.gitmodules` 保留为路径/代际 authority。两次 snapshot 纳入 gitlink、checkout 物理身份及实际 "
                  "commit/branch/dirty，漂移 fail closed。后续 #92 fingerprint 与 #93 持久化/API 必须完整保留 dirty；本批不提前实现其 service/route。\n"
              )
              text = text.replace(anchor, batch + anchor, 1)
          write_if_changed(ledger, text)

          # Task fixture and downstream blocker.
          tasks = Path("openspec/changes/m2-research-context/tasks.md")
          text = tasks.read_text()
          fixture_marker = "- [x] 4.1a P0 correction #132"
          if fixture_marker not in text:
              anchor = "- [ ] 4.2 StackLock 组装 + 内容域 canonical fingerprint"
              if anchor not in text:
                  raise SystemExit("tasks 4.2 anchor missing")
              fixture = textwrap.dedent('''
              - [x] 4.1a P0 correction #132 — StackLock 四 repo revision 增 required `dirty:boolean`；collector 以 gitlink/HEAD `.gitmodules` 作路径与代际 authority，但输出实际 checkout HEAD/branch/detached/dirty；checkout 物理身份与完整状态进入双快照，漂移 typed fail closed；同步 canonical/OpenSpec/生成 schema（验证见 `evidence/issue-132.md`）。
                - Fixture (#132): expanded / high；schema/evidence contract、四 repo Git read surface、shared collector、dirty fingerprint downstream 与 frozen-spec bug correction 触发 mandatory expanded。
                - Invariant Matrix (#132): authority = superproject gitlinks + exact HEAD `.gitmodules` + four physical checkout identities；record truth = each checkout actual HEAD/branch/dirty；validators = exact top-level/no-follow/bounded Git parser + required schema；storage = deferred #92/#93；failure = `collection_state_changed`, zero partial output。
                - Risk packs (#132): Public API、Config、File IO/path、Schema、Auth/secrets、Concurrency、Resource bounds、Legacy compatibility、Error handling、Release/docs 与全部三项 domain packs selected；逐项理由和 regression rows 见 evidence。
                - Boundary checklist (#132): change schema/generated docs/collector/tests/canonical/OpenSpec only；zero write/fetch/submodule mutation；不提前实现 #92 assembly/fingerprint/store 或 #93 routes。
                - Evidence floor (#132): actual HEAD != gitlink、tracked/untracked、clean sibling、detached、physical symlink、snapshot drift、no-mutation；三项 source-bound red proof；schemas/core/backend/check/schema/perf/OpenSpec/hygiene。
              ''')
              text = text.replace(anchor, fixture + anchor, 1)
          text = text.replace("（依赖: 4.1。验证:", "（依赖: 4.1、4.1a/#132。验证:", 1)
          write_if_changed(tasks, text)

          evidence = Path("openspec/changes/m2-research-context/evidence/issue-132.md")
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence_text = f'''# Issue #132 — StackLock actual checkout state evidence

          - Workflow: `subagent-workflow` 0.31.0
          - Fixture: expanded
          - Repair intensity: high
          - Minimal mergeable slice: schema + collector + tests + canonical/OpenSpec correction; no #92/#93 service or route implementation
          - Evidence workflow run: `{os.environ.get("EVIDENCE_RUN_ID", "unknown")}`

          ## Governing invariant

          A successful StackLock collection records the actual reproducible state of all four checkout directories (`commit`, `branch`, required `dirty`) while superproject gitlinks and `HEAD:.gitmodules` remain internal path/generation authority; every authority and checkout state must match across the two snapshots or the whole collection fails without partial output.

          ## Risk packs

          - Public API/schema: selected — persisted StackLock shape changes.
          - Config/project setup: selected — `.gitmodules`, provider and package identities participate in the same snapshot.
          - File IO/path safety: selected — four physical checkout directories use no-follow identity binding.
          - Auth/secrets: selected — Git environment remains minimal and provider secrets remain non-observable.
          - Concurrency/shared state: selected — HEAD/branch/dirty/path replacement between snapshots must fail closed.
          - Resource limits: selected — fixed four paths, bounded Git output/timeouts; no recursive discovery.
          - Legacy compatibility/migration: selected — old StackLock records lacking dirty are invalid under the corrected required contract; no persisted M2 StackLock service has shipped yet.
          - Error/rollback: selected — stable typed failures and zero partial content.
          - Release/docs: selected — generated schemas and frozen-spec correction ledger change.
          - Scientific evidence lineage, hydrology repositories, Zero governance: selected — all four repo states are reproduction evidence; no scientific conclusion or submodule source mutation.

          ## Invariant Matrix

          - Producers: superproject inventory/blob reader; four checkout root/HEAD/branch/status observers.
          - Validators: physical path `(dev, ino)`, exact Git top-level + empty prefix, 40-hex HEAD, bounded single-line branch, porcelain dirty boolean, StackLock strict schema.
          - Storage/query/routes: none in #132; #92/#93 are explicitly blocked until they preserve dirty.
          - Failure paths: missing/replaced/symlink checkout, malformed Git output, or any cross-snapshot gitlink/checkout-state drift -> non-disclosing typed failure, no partial result.
          - Evidence: independent synthetic four-repo fixtures, existing collector regressions, generated-schema drift check, semantic red proof, full CI.

          ## Regression rows

          - actual HEAD differs from gitlink -> actual commit/branch recorded, no rejection or fallback.
          - tracked or untracked changes -> dirty true; unchanged siblings remain false.
          - detached checkout -> `branch="detached"`.
          - checkout state changes between snapshots -> `collection_state_changed`, no result.
          - stable clean four-repo checkout -> deterministic complete collection and no HEAD/index/status/byte mutation.
          - symlink replacement -> rejected without reading or modifying target.
          - full-root integration is opt-in with `SH_TEST_FULL_SUBMODULES=1`; standard CI uses independent synthetic four-repo Git checkouts because CI initializes only the zero submodule.

          ## Source-bound red proof

          This workflow retains tests while independently weakening: (1) required dirty schema -> optional; (2) dirty observer -> constant false; (3) snapshot repo-state comparison -> bypassed. Each named focused test must turn red, then exact source is restored before full verification.

          ## Execution-path deviation

          The ChatGPT GitHub-App environment has no native implementer/reviewer/verifier subagent primitive. No agent fan-out is claimed. The orchestrator separated correctness, integration, security/resource, test-evidence, spec-compliance and invariant-state review passes and leaves the PR Draft for the human merge gate.
          '''
          write_if_changed(evidence, textwrap.dedent(evidence_text).strip())
          PY
      - name: Install and regenerate
        run: |
          bun install --frozen-lockfile
          bun run schema:generate
      - name: Focused green baseline
        run: |
          bun test packages/core/src/domain/schemas/core-schemas.test.ts
          bun test packages/core/src/domain/services/stack-lock-collector.test.ts packages/core/src/domain/services/stack-lock-dirty-state.test.ts
      - name: Source-bound semantic red proof
        shell: bash
        run: |
          set -euo pipefail
          schema=packages/core/src/domain/schemas/stack-lock.ts
          collector=packages/core/src/domain/services/stack-lock-collector.ts
          cp "$schema" /tmp/stack-lock-schema.ts
          cp "$collector" /tmp/stack-lock-collector.ts

          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/domain/schemas/stack-lock.ts')
          s=p.read_text()
          old='dirty: z.boolean()'
          if s.count(old) != 1: raise SystemExit('dirty schema mutation count')
          p.write_text(s.replace(old, 'dirty: z.boolean().optional()', 1))
          PY
          set +e
          bun test packages/core/src/domain/schemas/core-schemas.test.ts -t "requires a boolean dirty field" >/tmp/red-schema.log 2>&1
          schema_status=$?
          set -e
          test "$schema_status" -ne 0
          cp /tmp/stack-lock-schema.ts "$schema"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/domain/services/stack-lock-collector.ts')
          s=p.read_text()
          old='return stdout.length > 0;'
          if s.count(old) != 1: raise SystemExit('dirty observer mutation count')
          p.write_text(s.replace(old, 'return false;', 1))
          PY
          set +e
          bun test packages/core/src/domain/services/stack-lock-dirty-state.test.ts -t "marks tracked and untracked" >/tmp/red-dirty.log 2>&1
          dirty_status=$?
          set -e
          test "$dirty_status" -ne 0
          cp /tmp/stack-lock-collector.ts "$collector"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/domain/services/stack-lock-collector.ts')
          s=p.read_text()
          old='JSON.stringify(first.repos) === JSON.stringify(second.repos) &&'
          if s.count(old) != 1: raise SystemExit('snapshot comparison mutation count')
          p.write_text(s.replace(old, 'true &&', 1))
          PY
          set +e
          bun test packages/core/src/domain/services/stack-lock-dirty-state.test.ts -t "fails closed when a repository changes" >/tmp/red-snapshot.log 2>&1
          snapshot_status=$?
          set -e
          test "$snapshot_status" -ne 0
          cp /tmp/stack-lock-collector.ts "$collector"

          cmp -s "$schema" /tmp/stack-lock-schema.ts
          cmp -s "$collector" /tmp/stack-lock-collector.ts
          bun test packages/core/src/domain/schemas/core-schemas.test.ts
          bun test packages/core/src/domain/services/stack-lock-collector.test.ts packages/core/src/domain/services/stack-lock-dirty-state.test.ts
      - name: Full verification
        shell: bash
        run: |
          set -euo pipefail
          bun run test:schemas
          bun run test:core-services
          bun run test:backend-api
          bun run schema:check
          bun run typecheck
          bun run check
          bun run test:perf:api
          npx --yes @fission-ai/openspec@1.3.1 validate m2-research-context --strict --no-interactive
          git diff --check
          git -C zero diff --quiet
          test -z "$(git ls-files workspace)"
          git diff --exit-code origin/main -- package.json packages/*/package.json bun.lock
      - name: Commit verified contracts and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/03_SPEC/Minimal_Schemas.md \
            docs/Phased_Spec_Activation.md \
            docs/generated/json-schema/stack-lock.json \
            docs/generated/schema/stack-lock.md \
            openspec/changes/m2-research-context/design.md \
            openspec/changes/m2-research-context/specs/stack-lock/spec.md \
            openspec/changes/m2-research-context/tasks.md \
            openspec/changes/m2-research-context/evidence/issue-132.md
          git commit -m "docs(stack-lock): align actual repo state contracts (#132)"
          git push origin HEAD:feat/issue-132-stack-lock-dirty-state
