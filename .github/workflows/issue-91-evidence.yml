name: Issue 91 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue-91-evidence.yml"
      - "packages/core/src/domain/services/stack-lock-collector.ts"
      - "packages/core/src/domain/services/stack-lock-collector.test.ts"
      - "openspec/changes/m2-research-context/**"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init zero submodule only
        run: git submodule update --init zero

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      - name: Focused green baseline
        run: bun test packages/core/src/domain/services/stack-lock-collector.test.ts

      - name: Source-bound semantic red proof
        shell: bash
        run: |
          set -euo pipefail
          source_file=packages/core/src/domain/services/stack-lock-collector.ts
          test_file=packages/core/src/domain/services/stack-lock-collector.test.ts
          cp "$source_file" /tmp/stack-lock-collector.original.ts

          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/core/src/domain/services/stack-lock-collector.ts")
          source = path.read_text()
          old = 'commit: revisions.get("zero")!,'
          new = 'commit: revisions.get("SHUD")!,'
          if source.count(old) != 1:
              raise SystemExit("zero-binding mutation source did not match exactly once")
          path.write_text(source.replace(old, new))
          PY
          set +e
          bun test "$test_file" -t "collects four gitlinks" >/tmp/issue-91-zero-red.log 2>&1
          zero_status=$?
          set -e
          cat /tmp/issue-91-zero-red.log
          cp /tmp/stack-lock-collector.original.ts "$source_file"
          test "$zero_status" -ne 0
          grep -F "collects four gitlinks" /tmp/issue-91-zero-red.log

          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/core/src/domain/services/stack-lock-collector.ts")
          source = path.read_text()
          old = 'createHash("sha256").update("{}", "utf8").digest("hex")'
          new = 'createHash("sha256").update(Buffer.alloc(0)).digest("hex")'
          if source.count(old) != 1:
              raise SystemExit("digest-separation mutation source did not match exactly once")
          path.write_text(source.replace(old, new))
          PY
          set +e
          bun test "$test_file" -t "collects four gitlinks" >/tmp/issue-91-digest-red.log 2>&1
          digest_status=$?
          set -e
          cat /tmp/issue-91-digest-red.log
          cp /tmp/stack-lock-collector.original.ts "$source_file"
          test "$digest_status" -ne 0
          grep -F "collects four gitlinks" /tmp/issue-91-digest-red.log

          cmp -s "$source_file" /tmp/stack-lock-collector.original.ts
          bun test "$test_file"
          git diff --exit-code -- "$source_file"

      - name: Strict OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.3.1 validate m2-research-context --strict --no-interactive

      - name: Boundary and hygiene checks
        shell: bash
        run: |
          git diff --check
          git -C zero diff --quiet
          test -z "$(git ls-files workspace)"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- package.json packages/*/package.json bun.lock
