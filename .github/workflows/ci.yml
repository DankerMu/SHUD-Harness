name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Link checker self-test
        run: scripts/docs/self_test.sh

      - name: Check docs Markdown links
        run: scripts/docs/check_links.sh

  plugins:
    name: plugins (typecheck + vitest + schema drift)
    runs-on: ubuntu-latest
    steps:
      # SHUD/rSHUD/AutoSHUD are large scientific repos unrelated to the TS plugins; not initialised.
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Check generated schema drift
        run: pnpm run schema:check
