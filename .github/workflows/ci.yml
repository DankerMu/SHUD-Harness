name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Link checker self-test
        run: scripts/docs/self_test.sh

      - name: Check docs Markdown links
        run: scripts/docs/check_links.sh

  linux-base:
    name: linux-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      # Bun workspace 含 zero/packages/*，装依赖前只需 zero；SHUD/rSHUD/AutoSHUD 是
      # 大体量科学仓库，与 typecheck/单测无关，故不初始化。
      - name: Init zero submodule only
        run: git submodule update --init zero

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      # M1 unit-test hook. Additional focused suites are wired by their owning issues.
      - name: Typecheck + unit tests
        run: bun run check

      # Future hook (#23): schema drift check plugs in here after schema generation lands.
      # Future hook (#32): PERF-API-001 smoke plugs in here after the API fixture lands.

      # 项目铁律：zero 作为 root submodule 钉住不 fork，spike 条 5 要求 diff 为零。
      - name: Verify zero submodule unchanged
        run: |
          git -C zero diff --quiet
          test "$(git -C zero rev-parse HEAD)" = "13e25c116c62411e6ee8a0ad67a6c53dc7c376c6"

  macos-seatbelt:
    name: macos-seatbelt
    runs-on: macos-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init zero submodule only
        run: git submodule update --init zero

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      - name: Require macOS seatbelt prerequisites
        run: |
          test "$(uname -s)" = "Darwin"
          test -x /usr/bin/sandbox-exec
          python3 --version

      - name: Policy gate seatbelt tests
        run: bun run test:policy-gate
        env:
          SHUD_REQUIRE_SEATBELT_TESTS: "1"

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - docs-links
      - linux-base
      - macos-seatbelt
    if: always()
    steps:
      - name: Require dependent checks
        run: |
          test "${{ needs.docs-links.result }}" = "success"
          test "${{ needs.linux-base.result }}" = "success"
          test "${{ needs.macos-seatbelt.result }}" = "success"
