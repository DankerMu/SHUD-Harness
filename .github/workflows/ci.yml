name: CI

# Risk-layered PR gate. Branch protection requires exactly one check: `all-checks-passed`
# (always() aggregator; a skipped or failed job fails it). Thresholds live in constraints.yaml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (eslint + prettier + naming + jscpd + knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run naming:check
      - run: pnpm run dup
      - run: pnpm run deadcode

  test:
    name: test (typecheck + vitest coverage + schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run schema:check

  docs-gate:
    name: docs-gate (links + path claims + generated instructions + decision records)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Link checker self-test
        run: scripts/docs/self_test.sh
      - run: pnpm run docs:check

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: semgrep scan --config p/typescript --config p/secrets --error --metrics=off --exclude SHUD --exclude rSHUD --exclude AutoSHUD

  pr-size:
    name: pr-size (constraints.yaml pr_diff_lines_max; label size-exempt bypass is logged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: Check PR size
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: sh scripts/guardrails/pr-size.sh
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "pr-size applies to pull requests only; push to main is post-merge"

  profile-smoke:
    name: profile-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare pinned npm host
        run: |
          mkdir -p "$RUNNER_TEMP/dsh"
          printf '{"name":"dsh-ci","private":true}\n' > "$RUNNER_TEMP/dsh/package.json"
          printf 'auto-install-peers=true\n' > "$RUNNER_TEMP/dsh/.npmrc"
          node -e 'console.log("DSH_VERSION=" + JSON.parse(require("node:fs").readFileSync("profile/shud/package.json", "utf8")).peerDependencies["@deepseek-ai/dsh"])' >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh/node_modules
          key: ${{ runner.os }}-dsh-${{ env.DSH_VERSION }}-pnpm-11.28.5-node-24
      - name: Install pinned dsh without native build scripts
        run: pnpm --dir "$RUNNER_TEMP/dsh" add --ignore-scripts "@deepseek-ai/dsh@$DSH_VERSION"
      - name: Verify Web profile configuration and plugin import
        env:
          DSH_ROOT: ${{ runner.temp }}/dsh/node_modules/@deepseek-ai/dsh
          DSH_HOME: ${{ runner.temp }}/home
        run: pnpm run profile:smoke

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [lint, test, docs-gate, secrets, sast, pr-size, profile-smoke]
    if: always()
    steps:
      - name: Fail if any required job did not succeed (failure, cancelled or skipped)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "required jobs not successful (result must be success, never skipped): $bad" >&2
            exit 1
          fi
          echo "all required checks passed"
