name: Issue 132 repair

on:
  push:
    branches: [feat/issue-132-stack-lock-dirty-state]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-132-stack-lock-dirty-state
          fetch-depth: 0
      - name: Sync main and repair collector authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/core/src/domain/services/stack-lock-collector.ts")
          source = path.read_text()

          def once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"collector replacement expected once, found {count}: {old[:80]!r}")
              source = source.replace(old, new)

          once(
          '''interface RepositoryRootAuthority {
            readonly path: string;
            readonly identity: RepositoryRootIdentity;
          }

          interface StackLockCheapSnapshot {
            readonly repositoryRoot: RepositoryRootAuthority;
            readonly repos: StackLock["repos"];
            readonly harness: HarnessIdentity;''',
          '''interface RepositoryRootAuthority {
            readonly path: string;
            readonly identity: RepositoryRootIdentity;
          }

          interface RepositoryCheckoutAuthority {
            readonly path: string;
            readonly identity: RepositoryRootIdentity;
          }

          interface StackLockCheapSnapshot {
            readonly repositoryRoot: RepositoryRootAuthority;
            readonly repos: StackLock["repos"];
            readonly gitlinks: Readonly<Record<StackLockRepositoryName, string>>;
            readonly repositoryCheckouts: Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>;
            readonly harness: HarnessIdentity;''')

          once(
          '''      repositoryRoot: reportedRepositoryRoot,
                repos: authority.repos,
                harness,''',
          '''      repositoryRoot: reportedRepositoryRoot,
                repos: authority.repos,
                gitlinks: authority.gitlinks,
                repositoryCheckouts: authority.repositoryCheckouts,
                harness,''')

          once(
          '''    JSON.stringify(first.repos) === JSON.stringify(second.repos) &&
              first.harness.version === second.harness.version &&''',
          '''    JSON.stringify(first.repos) === JSON.stringify(second.repos) &&
              JSON.stringify(first.gitlinks) === JSON.stringify(second.gitlinks) &&
              repositoryCheckoutAuthoritiesMatch(first.repositoryCheckouts, second.repositoryCheckouts) &&
              first.harness.version === second.harness.version &&''')

          once(
          '''function sameRepositoryRootAuthority(
            left: RepositoryRootAuthority,
            right: RepositoryRootAuthority
          ): boolean {
            return left.path === right.path && sameRepositoryRootIdentity(left.identity, right.identity);
          }

          async function assertCurrentRepositoryRoot''',
          '''function sameRepositoryRootAuthority(
            left: RepositoryRootAuthority,
            right: RepositoryRootAuthority
          ): boolean {
            return left.path === right.path && sameRepositoryRootIdentity(left.identity, right.identity);
          }

          function repositoryCheckoutAuthoritiesMatch(
            left: Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>,
            right: Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>
          ): boolean {
            return STACK_LOCK_REPOSITORY_NAMES.every((name) =>
              left[name].path === right[name].path &&
              sameRepositoryRootIdentity(left[name].identity, right[name].identity)
            );
          }

          async function assertCurrentRepositoryRoot''')

          head_pattern = re.compile(r'''async function collectHeadAuthority\([\s\S]*?\n}\n\nasync function collectHeadAuthorityInventory''')
          head_replacement = '''interface RepositoryCollection {
            readonly repos: StackLock["repos"];
            readonly authorities: Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>;
          }

          async function collectHeadAuthority(
            repositoryRoot: RepositoryRootAuthority,
            gitCommand: StackLockGitCommand
          ): Promise<{
            readonly repos: StackLock["repos"];
            readonly gitlinks: Readonly<Record<StackLockRepositoryName, string>>;
            readonly repositoryCheckouts: Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>;
            readonly gitmodules: GitmodulesIdentity;
          }> {
            const inventory = await withRepositoryRootAuthority(
              repositoryRoot,
              async () => await collectHeadAuthorityInventory(repositoryRoot.path, gitCommand)
            );
            const gitmodules = await withRepositoryRootAuthority(
              repositoryRoot,
              async () => await readHeadGitmodulesIdentity(
                repositoryRoot.path,
                inventory.gitmodulesObjectId,
                gitCommand
              )
            );
            assertExpectedGitmodules(gitmodules);
            const repositoryCollection = await withRepositoryRootAuthority(
              repositoryRoot,
              async () =>
                await collectRepositoryRevisions(
                  repositoryRoot.path,
                  gitmodules.declarations,
                  gitCommand
                )
            );
            return Object.freeze({
              repos: repositoryCollection.repos,
              gitlinks: inventory.revisions,
              repositoryCheckouts: repositoryCollection.authorities,
              gitmodules
            });
          }

          async function collectHeadAuthorityInventory'''
          source, count = head_pattern.subn(head_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"head authority block replacement count {count}")

          repo_pattern = re.compile(r'''async function collectRepositoryRevisions\([\s\S]*?\n}\n\nasync function collectRepositoryHeadCommit''')
          repo_replacement = '''async function collectRepositoryRevisions(
            repositoryRoot: string,
            declarations: Readonly<Record<StackLockRepositoryName, GitmoduleDeclaration>>,
            gitCommand: StackLockGitCommand
          ): Promise<RepositoryCollection> {
            const resolved = Object.freeze(
              await Promise.all(
                STACK_LOCK_REPOSITORY_NAMES.map(async (name) => {
                  const authority = await resolveRepositoryCheckoutAuthority(
                    repositoryRoot,
                    declarations[name].path
                  );
                  const revision = await withRepositoryCheckoutAuthority(authority, async () => {
                    await assertRepositoryGitTopLevel(authority, gitCommand);
                    const [commit, branch, dirty] = await Promise.all([
                      collectRepositoryHeadCommit(authority.path, gitCommand),
                      collectRepositoryHeadBranch(authority.path, gitCommand),
                      collectRepositoryDirty(authority.path, gitCommand)
                    ]);
                    return Object.freeze({ commit, branch, dirty });
                  });
                  return [name, revision, authority] as const;
                })
              )
            );
            return Object.freeze({
              repos: Object.freeze(Object.fromEntries(
                resolved.map(([name, revision]) => [name, revision])
              )) as StackLock["repos"],
              authorities: Object.freeze(Object.fromEntries(
                resolved.map(([name, _revision, authority]) => [name, authority])
              )) as Readonly<Record<StackLockRepositoryName, RepositoryCheckoutAuthority>>
            });
          }

          async function resolveRepositoryCheckoutAuthority(
            repositoryRoot: string,
            relativePath: string
          ): Promise<RepositoryCheckoutAuthority> {
            const requestedPath = join(repositoryRoot, relativePath);
            try {
              const physicalPath = await realpath(requestedPath);
              const firstIdentity = await observeRepositoryRootIdentity(requestedPath);
              if (physicalPath !== requestedPath || !(await isSafeExistingDirectoryPath(requestedPath))) {
                throw new Error("repository checkout is not a safe physical directory");
              }
              const secondIdentity = await observeRepositoryRootIdentity(requestedPath);
              if (!sameRepositoryRootIdentity(firstIdentity, secondIdentity)) {
                throw new Error("repository checkout changed during admission");
              }
              return Object.freeze({ path: requestedPath, identity: secondIdentity });
            } catch {
              throw new StackLockCollectionError("collection_contract_invalid");
            }
          }

          async function assertCurrentRepositoryCheckout(
            authority: RepositoryCheckoutAuthority
          ): Promise<void> {
            try {
              const current = await observeRepositoryRootIdentity(authority.path);
              if (!sameRepositoryRootIdentity(authority.identity, current)) {
                throw new Error("repository checkout identity changed");
              }
            } catch {
              throw new StackLockCollectionError("collection_state_changed");
            }
          }

          async function withRepositoryCheckoutAuthority<T>(
            authority: RepositoryCheckoutAuthority,
            producer: () => Promise<T>
          ): Promise<T> {
            await assertCurrentRepositoryCheckout(authority);
            let result: T | undefined;
            let producerError: unknown;
            try {
              result = await producer();
            } catch (error) {
              producerError = error;
            }
            await assertCurrentRepositoryCheckout(authority);
            if (producerError !== undefined) throw producerError;
            return result as T;
          }

          async function readRepositoryGitText(
            repositoryRoot: string,
            args: readonly string[],
            gitCommand: StackLockGitCommand
          ): Promise<string> {
            let rawResult: unknown;
            try {
              rawResult = await gitCommand({ cwd: repositoryRoot, args: Object.freeze([...args]) });
            } catch {
              throw new StackLockCollectionError("git_read_failed");
            }
            try {
              return UTF8_DECODER.decode(
                boundedGitOutputBytes(asRecord(rawResult)?.stdout, MAX_GIT_OUTPUT_BYTES)
              );
            } catch {
              throw new StackLockCollectionError("git_output_invalid");
            }
          }

          async function assertRepositoryGitTopLevel(
            authority: RepositoryCheckoutAuthority,
            gitCommand: StackLockGitCommand
          ): Promise<void> {
            const stdout = await readRepositoryGitText(
              authority.path,
              [GIT_NO_LAZY_FETCH_GLOBAL_ARG, "rev-parse", "--show-toplevel", "--show-prefix"],
              gitCommand
            );
            const lines = stdout.split("\\n");
            if (lines.length != 3 || lines[1] !== "" || lines[2] !== "" || !isAbsolute(lines[0]!)) {
              throw new StackLockCollectionError("git_output_invalid");
            }
            let physicalTopLevel: string;
            try {
              physicalTopLevel = await realpath(lines[0]!);
            } catch {
              throw new StackLockCollectionError("collection_contract_invalid");
            }
            if (physicalTopLevel !== authority.path) {
              throw new StackLockCollectionError("collection_contract_invalid");
            }
          }

          async function collectRepositoryHeadCommit'''
          source, count = repo_pattern.subn(repo_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"repository observer block replacement count {count}")

          commit_pattern = re.compile(r'''async function collectRepositoryHeadCommit\([\s\S]*?\n}\n\nasync function collectRepositoryHeadBranch''')
          commit_replacement = '''async function collectRepositoryHeadCommit(
            repositoryRoot: string,
            gitCommand: StackLockGitCommand
          ): Promise<string> {
            const stdout = await readRepositoryGitText(
              repositoryRoot,
              [GIT_NO_LAZY_FETCH_GLOBAL_ARG, "rev-parse", "HEAD"],
              gitCommand
            );
            if (!stdout.endsWith("\\n")) {
              throw new StackLockCollectionError("git_output_invalid");
            }
            const commit = stdout.slice(0, -1).replace(/\\r$/u, "");
            if (!/^[0-9A-Fa-f]{40}$/u.test(commit)) {
              throw new StackLockCollectionError("git_output_invalid");
            }
            return commit.toLowerCase();
          }

          async function collectRepositoryHeadBranch'''
          source, count = commit_pattern.subn(commit_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"commit observer replacement count {count}")

          branch_pattern = re.compile(r'''async function collectRepositoryHeadBranch\([\s\S]*?\n}\n\nasync function collectRepositoryDirty''')
          branch_replacement = '''async function collectRepositoryHeadBranch(
            repositoryRoot: string,
            gitCommand: StackLockGitCommand
          ): Promise<string> {
            const stdout = await readRepositoryGitText(
              repositoryRoot,
              [GIT_NO_LAZY_FETCH_GLOBAL_ARG, "rev-parse", "--abbrev-ref", "HEAD"],
              gitCommand
            );
            if (!stdout.endsWith("\\n")) {
              throw new StackLockCollectionError("git_output_invalid");
            }
            const branch = stdout.slice(0, -1).replace(/\\r$/u, "");
            if (branch === "HEAD") return DETACHED_BRANCH_LABEL;
            if (branch.length === 0 || branch.includes("\\0") || branch.includes("\\n")) {
              throw new StackLockCollectionError("git_output_invalid");
            }
            return branch;
          }

          async function collectRepositoryDirty'''
          source, count = branch_pattern.subn(branch_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"branch observer replacement count {count}")

          dirty_pattern = re.compile(r'''async function collectRepositoryDirty\([\s\S]*?\n}\n\nfunction isStackLockRepositoryName''')
          dirty_replacement = '''async function collectRepositoryDirty(
            repositoryRoot: string,
            gitCommand: StackLockGitCommand
          ): Promise<boolean> {
            const stdout = await readRepositoryGitText(
              repositoryRoot,
              [
                GIT_NO_LAZY_FETCH_GLOBAL_ARG,
                "status",
                "--porcelain=v1",
                "--untracked-files=all",
                "--ignore-submodules=none",
                "--"
              ],
              gitCommand
            );
            return stdout.length > 0;
          }

          function isStackLockRepositoryName'''
          source, count = dirty_pattern.subn(dirty_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"dirty observer replacement count {count}")

          path.write_text(source)

          test_path = Path("packages/core/src/domain/services/stack-lock-collector.test.ts")
          tests = test_path.read_text()

          def test_once(old: str, new: str) -> None:
              global tests
              count = tests.count(old)
              if count != 1:
                  raise SystemExit(f"test replacement expected once, found {count}: {old[:80]!r}")
              tests = tests.replace(old, new)

          test_once("expect(calls).toHaveLength(30);", "expect(calls).toHaveLength(38);")
          test_once("expect(shudHeadReads).toHaveLength(4);", "expect(shudHeadReads).toHaveLength(6);")
          test_once(
          '''    expect(shudHeadReads.slice(0, 2)).toEqual([
                {
                  cwd: resolve(join(repositoryRoot, "SHUD")),
                  args: ["--no-lazy-fetch", "rev-parse", "HEAD"]
                },
                {
                  cwd: resolve(join(repositoryRoot, "SHUD")),
                  args: ["--no-lazy-fetch", "rev-parse", "--abbrev-ref", "HEAD"]
                }
              ]);''',
          '''    expect(shudHeadReads.filter((call) => call.args.at(-1) === "--show-prefix")).toHaveLength(2);
              expect(shudHeadReads.filter((call) => call.args.at(-1) === "HEAD" && call.args.length === 3)).toHaveLength(2);
              expect(shudHeadReads.filter((call) => call.args.includes("--abbrev-ref"))).toHaveLength(2);''')
          test_once('code: "collection_contract_invalid",\n      message: "StackLock context collection failed."', 'code: "collection_state_changed",\n      message: "StackLock context collection failed."')
          test_once(
          '''  await mkdir(join(repositoryRoot, "config", "providers"), { recursive: true });''',
          '''  await mkdir(join(repositoryRoot, "config", "providers"), { recursive: true });
            await Promise.all(STACK_LOCK_REPOSITORY_NAMES.map((name) =>
              mkdir(join(repositoryRoot, name), { recursive: true })
            ));''')
          marker = '''  if (
              args.length === 3 &&
              args[0] === "--no-lazy-fetch" &&
              args[1] === "rev-parse" &&
              args[2] === "HEAD"
            ) {'''
          insertion = '''  if (
              args.length === 4 &&
              args[0] === "--no-lazy-fetch" &&
              args[1] === "rev-parse" &&
              args[2] === "--show-toplevel" &&
              args[3] === "--show-prefix"
            ) {
              return { stdout: `${resolve(cwd)}\\n\\n` };
            }
          ''' + marker
          test_once(marker, insertion)
          test_once(
          '''    args.length === 5 &&
                args[0] === "--no-lazy-fetch" &&
                args[1] === "status" &&
                args[2] === "--porcelain=v1" &&
                args[3] === "--untracked-files=all" &&
                args[4] === "--"''',
          '''    args.length === 6 &&
                args[0] === "--no-lazy-fetch" &&
                args[1] === "status" &&
                args[2] === "--porcelain=v1" &&
                args[3] === "--untracked-files=all" &&
                args[4] === "--ignore-submodules=none" &&
                args[5] === "--"''')
          test_path.write_text(tests)

          schema_test = Path("packages/core/src/domain/schemas/core-schemas.test.ts")
          schema_source = schema_test.read_text()
          appendix = r'''

          describe("StackLock repository dirty state", () => {
            test("requires a boolean dirty field for every repository revision", () => {
              const clean = validStackLock();
              expect(StackLockSchema.safeParse(clean).success).toBe(true);
              expect(StackLockSchema.safeParse({
                ...clean,
                repos: {
                  ...clean.repos,
                  SHUD: { ...clean.repos.SHUD, dirty: true }
                }
              }).success).toBe(true);

              const { dirty: _missing, ...withoutDirty } = clean.repos.SHUD;
              const missing = StackLockSchema.safeParse({
                ...clean,
                repos: { ...clean.repos, SHUD: withoutDirty }
              });
              expect(missing.success).toBe(false);
              expect(issuePaths(missing)).toContain("repos.SHUD.dirty");

              const wrongType = StackLockSchema.safeParse({
                ...clean,
                repos: {
                  ...clean.repos,
                  zero: { ...clean.repos.zero, dirty: "false" }
                }
              });
              expect(wrongType.success).toBe(false);
              expect(issuePaths(wrongType)).toContain("repos.zero.dirty");
            });
          });
          '''
          if 'describe("StackLock repository dirty state"' not in schema_source:
              schema_test.write_text(schema_source + appendix)
          PY
          cat > packages/core/src/domain/services/stack-lock-dirty-state.test.ts <<'TS'
          import { afterEach, describe, expect, test } from "bun:test";
          import { execFileSync } from "node:child_process";
          import { mkdir, mkdtemp, readFile, realpath, rename, rm, symlink, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { dirname, join } from "node:path";
          import { collectStackLockContext, type StackLockGitCommand } from "./index";

          const REPOSITORIES = ["SHUD", "rSHUD", "AutoSHUD", "zero"] as const;
          type RepositoryName = (typeof REPOSITORIES)[number];
          const tempRoots: string[] = [];

          describe("StackLock actual repository state", () => {
            afterEach(async () => {
              await Promise.all(tempRoots.splice(0).map((root) => rm(root, { recursive: true, force: true })));
            });

            test("records actual HEAD and branch when checkout state differs from the superproject gitlink", async () => {
              const fixture = await createFixture();
              const oldPin = fixture.gitlinks.SHUD;
              await writeFile(join(fixture.repositories.SHUD, "tracked.txt"), "second commit\n");
              git(fixture.repositories.SHUD, ["add", "tracked.txt"]);
              git(fixture.repositories.SHUD, ["commit", "--quiet", "--message", "advance actual checkout"]);
              git(fixture.repositories.SHUD, ["branch", "-M", "feature/local-state"]);
              const actualHead = git(fixture.repositories.SHUD, ["rev-parse", "HEAD"]).trim();

              const result = await collectStackLockContext({ repositoryRoot: fixture.root });
              expect(result.repos.SHUD).toEqual({
                commit: actualHead,
                branch: "feature/local-state",
                dirty: false
              });
              expect(result.repos.SHUD.commit).not.toBe(oldPin);
            });

            test("marks tracked and untracked changes dirty while preserving clean siblings", async () => {
              const fixture = await createFixture();
              await writeFile(join(fixture.repositories.SHUD, "tracked.txt"), "modified\n");
              await writeFile(join(fixture.repositories.rSHUD, "untracked.txt"), "new\n");

              const result = await collectStackLockContext({ repositoryRoot: fixture.root });
              expect(result.repos.SHUD.dirty).toBe(true);
              expect(result.repos.rSHUD.dirty).toBe(true);
              expect(result.repos.AutoSHUD.dirty).toBe(false);
              expect(result.repos.zero.dirty).toBe(false);
            });

            test("uses the explicit detached label for a detached checkout", async () => {
              const fixture = await createFixture();
              git(fixture.repositories.AutoSHUD, ["checkout", "--quiet", "--detach", "HEAD"]);
              const result = await collectStackLockContext({ repositoryRoot: fixture.root });
              expect(result.repos.AutoSHUD.branch).toBe("detached");
              expect(result.repos.AutoSHUD.dirty).toBe(false);
            });

            test("fails closed when a repository changes between the two snapshots", async () => {
              const fixture = await createFixture();
              let shudStatusReads = 0;
              const gitCommand: StackLockGitCommand = async (input) => {
                const stdout = execFileSync("git", [...input.args], {
                  cwd: input.cwd,
                  encoding: "buffer",
                  env: { ...process.env, GIT_OPTIONAL_LOCKS: "0", GIT_NO_LAZY_FETCH: "1" }
                });
                if (
                  input.cwd === fixture.repositories.SHUD &&
                  input.args.includes("status") &&
                  ++shudStatusReads === 1
                ) {
                  await writeFile(join(fixture.repositories.SHUD, "drift.txt"), "drift\n");
                }
                return { stdout };
              };

              let collection: Awaited<ReturnType<typeof collectStackLockContext>> | undefined;
              let thrown: unknown;
              try {
                collection = await collectStackLockContext({ repositoryRoot: fixture.root, gitCommand });
              } catch (error) {
                thrown = error;
              }
              expect(collection).toBeUndefined();
              expect(thrown).toMatchObject({
                name: "StackLockCollectionError",
                code: "collection_state_changed",
                message: "StackLock context collection failed."
              });
            });

            test("does not modify repository HEAD, index, status, or tracked bytes", async () => {
              const fixture = await createFixture();
              const before = await observeFixture(fixture);
              const result = await collectStackLockContext({ repositoryRoot: fixture.root });
              expect(Object.values(result.repos).every((repo) => repo.dirty === false)).toBe(true);
              expect(await observeFixture(fixture)).toEqual(before);
            });

            test("rejects a repository path replaced by a symlink without reading or modifying the target", async () => {
              if (process.platform === "win32") return;
              const fixture = await createFixture();
              const original = fixture.repositories.SHUD;
              const displaced = join(dirname(fixture.root), "outside-shud");
              await rename(original, displaced);
              await symlink(displaced, original, "dir");
              const before = await readFile(join(displaced, "tracked.txt"), "utf8");

              await expect(collectStackLockContext({ repositoryRoot: fixture.root })).rejects.toMatchObject({
                name: "StackLockCollectionError",
                code: "collection_contract_invalid"
              });
              expect(await readFile(join(displaced, "tracked.txt"), "utf8")).toBe(before);
            });
          });

          interface Fixture {
            root: string;
            repositories: Record<RepositoryName, string>;
            gitlinks: Record<RepositoryName, string>;
          }

          async function createFixture(): Promise<Fixture> {
            const root = await realpath(await mkdtemp(join(tmpdir(), "stack-lock-dirty-")));
            tempRoots.push(root);
            await mkdir(join(root, "config", "providers"), { recursive: true });
            await writeFile(join(root, "package.json"), '{"name":"fixture","version":"0.8.3"}\n');
            await writeFile(
              join(root, "config", "providers", "glm.dmxapi.json"),
              JSON.stringify({
                default_provider: "glm-dmxapi",
                default_model: "glm-dmxapi/target",
                target_model_id: "glm-5.2",
                providers: {
                  "glm-dmxapi": {
                    base_url: "https://www.dmxapi.cn/v1",
                    models: { target: { model_id: "glm-5.2" } }
                  }
                }
              }) + "\n"
            );

            const repositories = {} as Record<RepositoryName, string>;
            const gitlinks = {} as Record<RepositoryName, string>;
            for (const name of REPOSITORIES) {
              const repository = join(root, name);
              repositories[name] = repository;
              await mkdir(repository);
              git(repository, ["init", "--quiet"]);
              configureGit(repository);
              await writeFile(join(repository, "tracked.txt"), `${name}\n`);
              git(repository, ["add", "tracked.txt"]);
              git(repository, ["commit", "--quiet", "--message", `initial ${name}`]);
              git(repository, ["branch", "-M", name === "zero" ? "development" : "master"]);
              gitlinks[name] = git(repository, ["rev-parse", "HEAD"]).trim();
            }

            await writeFile(
              join(root, ".gitmodules"),
              REPOSITORIES.map((name) => [
                `[submodule "${name}"]`,
                `\tpath = ${name}`,
                `\turl = https://example.invalid/${name}.git`,
                `\tbranch = ${name === "zero" ? "development" : "master"}`
              ].join("\n")).join("\n") + "\n"
            );
            git(root, ["init", "--quiet"]);
            configureGit(root);
            git(root, ["add", "package.json", "config/providers/glm.dmxapi.json", ".gitmodules"]);
            for (const name of REPOSITORIES) {
              git(root, ["update-index", "--add", "--cacheinfo", `160000,${gitlinks[name]},${name}`]);
            }
            git(root, ["commit", "--quiet", "--message", "superproject fixture"]);
            return { root, repositories, gitlinks };
          }

          function configureGit(root: string): void {
            git(root, ["config", "user.name", "StackLock Test"]);
            git(root, ["config", "user.email", "stack-lock@example.invalid"]);
          }

          function git(root: string, args: string[]): string {
            return execFileSync("git", args, {
              cwd: root,
              encoding: "utf8",
              stdio: ["ignore", "pipe", "pipe"]
            });
          }

          async function observeFixture(fixture: Fixture): Promise<Record<string, unknown>> {
            const result: Record<string, unknown> = {
              superHead: git(fixture.root, ["rev-parse", "HEAD"]),
              superStatus: git(fixture.root, ["status", "--porcelain=v1", "--ignore-submodules=none"]),
