name: Issue 132 aggregate core diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue-132-core-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-132-stack-lock-dirty-state
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: git submodule update --init zero
      - run: bun install --frozen-lockfile
      - name: Capture aggregate core-services failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bun run test:core-services >/tmp/core-services.log 2>&1
          status=$?
          set -e
          summary=.issue-132-core-diagnostic.log
          {
            printf 'AGGREGATE_STATUS=%s\n\n' "$status"
            printf '%s\n' '=== FAILURE SIGNALS ==='
            grep -nE '(^|[^A-Za-z])(FAIL|fail|Error|error|Expected|Received|timed out|timeout|panic)([^A-Za-z]|$)' /tmp/core-services.log | tail -n 200 || true
            printf '\n%s\n' '=== LOG TAIL ==='
            tail -n 300 /tmp/core-services.log
          } | sed -E 's#/home/runner/work/[^ ]+#<runner-path>#g' > "$summary"
          cat "$summary"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$summary"
          git commit -m "chore(issue-132): record aggregate core failure"
          git push origin HEAD:feat/issue-132-stack-lock-dirty-state
