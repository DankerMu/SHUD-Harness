# SHUD-Harness profile patch (ADR-0004 K2/K3/K9). Merged from ../dsh-spike/overlays/dmxapi-flash.patch.yml.
# Raw-data policy is supplied by the bundle's workspace package dependency.

# K3: DeepSeek Flash via the DMXAPI relay, native Messages adapter. Key comes from env DMXAPI_KEY.
- id: llm-deepseek
  config:
    baseURL: https://www.dmxapi.cn
    apiKeyEnv: DMXAPI_KEY
    models:
      - id: deepseek-flash-guan
        name: DeepSeek Flash (DMXAPI guan)
        contextWindow: 1000000
        systemPromptUpdate: in-history
        toolUpdate: addition-only
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash-guan

# K9: the only outbound channel turned off. It attaches the whole canonical session log as
# `dsh_session_log` to every official-route request; our endpoint is a third-party relay.
- id: session-log-deepseek
  disabled: true

# The old row cannot be renamed by an id patch: disable it, then insert the replacement.
- id: jobs
  disabled: true

# Web uses the preset id, not the declaring row id. Headless has no registry to patch.
- id: agent-preset-registry
  config:
    default: coordinator

- insert:
    - id: shud-raw-guard
      name: "@shud-harness/dsh-shud-raw-guard"
      config:
        rawDirs: ["data/raw"]
    - id: shud-policy-gate
      name: "@shud-harness/dsh-shud-policy-gate"
    - id: shud-jobs
      name: "@shud-harness/dsh-shud-jobs"
    - id: shud-tools
      name: "@shud-harness/dsh-shud-tools"
    - id: shud-role-restrict
      name: "@shud-harness/dsh-shud-presets"
    - id: preset-coordinator
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: coordinator
        order: 1
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: !!js >-
                process.getBuiltinModule('node:fs').readFileSync(
                process.getBuiltinModule('node:module').createRequire(baseUrl)
                .resolve('@shud-harness/dsh-shud-presets/prompts/coordinator.md'), 'utf8')
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: tool-subagent
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: spawn
              toolName: subagent
              agentPreset: worker
              modelSelectionSettings: false
    - id: preset-worker
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: worker
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: !!js >-
                process.getBuiltinModule('node:fs').readFileSync(
                process.getBuiltinModule('node:module').createRequire(baseUrl)
                .resolve('@shud-harness/dsh-shud-presets/prompts/worker.md'), 'utf8')
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
